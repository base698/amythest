[tools]
go = "1.27"
node = "26"

[tasks.assets]
description = "Build web assets"
run = "node web/build.mjs"
depends = ["npm-install"]

[tasks.npm-install]
description = "Install node dependencies"
run = "npm install --no-audit --no-fund"
sources = ["package.json", "package-lock.json"]

[tasks.build]
description = "Build amythest binary with web assets"
run = "go build -o bin/amythest ./cmd/amythest"
depends = ["assets"]

[tasks.run]
description = "Run amythest with the production config (one instance, original port)"
run = "./bin/amythest -config ~/.config/amythest/amythest.yaml"
depends = ["build"]

[tasks.test]
description = "Run all tests"
run = "go test ./..."

[tasks.gemfx]
description = "Regenerate the embedded gem intro frames (needs ttfx on PATH)"
run = """
printf '    ______\\n   /\\\\    /\\\\\\n  /  \\\\  /  \\\\\\n /____\\\\/____\\\\\\n \\\\    /\\\\    /\\n  \\\\  /  \\\\  /\\n   \\\\/____\\\\/\\n    \\\\    /\\n     \\\\  /\\n      \\\\/\\n   amythest\\n' \
  | ttfx --parity-dump --seed 42 beams --final-gradient-stops 8A2BE2 D787FF \
  > internal/tui/fxdata/beams.dump
gzip -9f internal/tui/fxdata/beams.dump
"""

[tasks.deploy]
description = "Build, install to ~/bin (atomic, with rollback copy), restart the service"
run = """
cp ~/bin/amythest ~/bin/amythest.previous 2>/dev/null || true
cp bin/amythest ~/bin/amythest.new
chmod +x ~/bin/amythest.new
mv ~/bin/amythest.new ~/bin/amythest
systemctl --user restart amythest
"""
depends = ["build"]
