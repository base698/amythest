id = "amythest"
name = "amythest"
version = "0.1.0"
description = "Your vault's tasks and kanban boards, inside herdr."
min_herdr_version = "0.8.0"
platforms = ["linux", "macos"]

# amy talks to a running amythest server over HTTP, so there is nothing to
# compile on the plugin side beyond the client itself. `plugin link` skips
# builds entirely, which is how this is developed.
[[build]]
platforms = ["linux", "macos"]
command = ["go", "build", "-o", "bin/amy", "./cmd/amy"]

# The board: the full amy TUI in a split beside your work.
[[panes]]
id = "board"
title = "amy"
placement = "split"
command = ["./scripts/amy.sh"]

# Quick capture: a modal popup that takes one line and files it in today's
# daily note. Closes itself on save.
[[panes]]
id = "capture"
title = "amy capture"
placement = "popup"
width = "70%"
height = 9
command = ["./scripts/amy.sh", "capture"]

# The wall: what agents produced for this workspace (commits, images) as a
# newest-first feed in a split on the right.
[[panes]]
id = "wall"
title = "wall"
placement = "split"
command = ["./scripts/amy.sh", "wall"]

# Find: one search over the vault, what agents made and their sessions.
# Enter goes to the pane where it happened, or opens the result in the browser.
[[panes]]
id = "find"
title = "find"
placement = "popup"
width = "80%"
height = "70%"
command = ["./scripts/amy.sh", "find"]

[[actions]]
id = "open-board"
title = "Open amy board"
description = "Open the amy board in a split beside the current work, or focus it if already open."
contexts = ["workspace"]
command = ["bash", "scripts/open-board.sh"]

[[actions]]
id = "quick-capture"
title = "Quick capture"
description = "Capture a task into today's daily note without leaving what you are doing."
contexts = ["workspace"]
command = ["bash", "scripts/quick-capture.sh"]

[[actions]]
id = "toggle-wall"
title = "Toggle wall"
description = "Show what agents produced for this workspace in a split on the right, or close it if it is open."
contexts = ["workspace"]
command = ["bash", "scripts/toggle-wall.sh"]

[[actions]]
id = "find"
title = "Find"
description = "Search notes, cards, tasks and what agents made; go to the pane where a result happened."
contexts = ["workspace"]
command = ["bash", "scripts/find.sh"]

# Optional messaging POC. Start `amy messages serve -demo` first.
[[panes]]
id = "messages"
title = "messages"
placement = "popup"
width = "90%"
height = "80%"
command = ["./scripts/amy.sh", "messages"]

[[actions]]
id = "messages"
title = "Message focus"
description = "Review messages, reply, attach wall items, or jump into IRC."
contexts = ["workspace"]
command = ["bash", "scripts/messages.sh"]
